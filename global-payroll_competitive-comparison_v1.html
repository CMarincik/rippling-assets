  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 16px; }

  /* ─── Page Tabs ─── */
  .page-tabs {

  .page-tabs .export-btn.exporting { pointer-events: none; opacity: 0.6; }

  body.print-mode .page-tabs { display: none !important; }

  /* ─── Cards ─── */
  .card {

    padding: 24px 28px;

  /* ─── Section title ─── */
  .section-title {

  /* ─── Key finding callout ─── */
  .key-finding {

  }
  .key-finding-text {

  }

    color: #3d2f0a;
    font-weight: 700;
  }

  /* ─── Comparison table ─── */
  .compare-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .compare-card-header {

  .compare-table {
    width: 100%;

  }
  .compare-table thead th {
    padding: 12px 16px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
    border-bottom: 1px solid var(--gray-200);

  }
  .compare-table thead th:nth-child(2) { color: var(--rip-purple-deep); }
  .compare-table thead th:nth-child(3) { color: var(--berry-700); }
  .compare-table thead th:first-child { width: 18%; }
  .compare-table thead th:nth-child(2) { width: 41%; }
  .compare-table thead th:nth-child(3) { width: 41%; }

  .compare-table tbody td {
    padding: 11px 16px;
    font-size: 13px;
    line-height: 1.5;

  }
  .compare-table tbody tr:last-child td { border-bottom: none; }
  .compare-table tbody td:first-child {

  }
  .compare-table tbody tr:nth-child(even) td { background: var(--gray-50); }

  /* ─── Tag pills ─── */
  .tag {

  /* ─── Summary card ─── */
  .summary-card {

  }
  .summary-title {

    color: var(--gray-900);
    margin-bottom: 4px;

  }
  .summary-card p {
    font-size: 13.5px; line-height: 1.65;
    color: var(--gray-600);
    margin-top: 12px;
  }
  .summary-card p strong {
    color: var(--gray-800);
    font-weight: 700;
  }
  .summary-divider {
    height: 1px;
    background: var(--gray-200);

  }
  .sources {
    margin-top: 14px;
    font-size: 11px; line-height: 1.5;
    color: var(--gray-400);
  }
  .sources strong {
    color: var(--gray-600);

  }

  /* ─── Highlight stat row ─── */
  .highlight-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) { .highlight-row { grid-template-columns: 1fr; } }
  .highlight-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);

  }
  .highlight-card.berry { border-top-color: var(--berry-700); }
  .highlight-card .h-label {
    font-size: 11px;

  }
  .highlight-card .h-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);

  }
  .highlight-card .h-purple { color: var(--rip-purple-deep); }
  .highlight-card .h-berry { color: var(--berry-700); }
  .highlight-card p {
    font-size: 13px;

  /* ─── Custom Modal ─── */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%;
    background: rgba(0,0,0,0.45);
    z-index: 9999; opacity: 0; transition: opacity .15s;
  }
  .modal-overlay.visible { opacity: 1; }
  .modal-box {
    position: absolute;

    background: white; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,0.25);

  }
  .modal-box.visible { transform: translateX(-50%); opacity: 1; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }

  .modal-input {
    width: 100%; height: 48px; padding: 0 16px; font-size: 15px; font-weight: 500;
    border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);

    transition: border-color .15s, box-shadow .15s;
  }
  .modal-input:focus {
    border-color: var(--purple-400);
    box-shadow: 0 0 0 3px rgba(80,46,60,0.12);

  .modal-actions button {

    cursor: pointer; border: none; transition: all .15s;

  .modal-cancel { background: var(--gray-100); color: var(--gray-600); }

  .footer-note {

<div style="background:#fef3c7;color:#92400e;text-align:center;padding:10px 16px;font-size:13px;font-weight:600;letter-spacing:0.3px;">
  This tool is for internal use only. Do not share externally.
</div>

<div class="header">
  <button class="header-export-btn" id="header-export-btn" onclick="exportPDF()">📄 Export PDF</button>
  <div class="logo" style="margin-bottom:14px;">
    <img src="https://raw.githubusercontent.com/CMarincik/rippling-assets/refs/heads/main/Rippling%20Logo%20white.svg" alt="Rippling" style="height:36px;width:auto;">

  <h1>Global Payroll Comparison</h1>
  <p>Rippling Global Payroll vs. Paylocity / Blue Marble</p>
</div>

<script>
/* ─── State ─── */
let state = {
  page: 'architecture'
};

/* ─── Render: Architecture ─── */
function renderArchitecture() {
  return `
    <div class="key-finding">
      <div class="key-finding-icon">i</div>
      <div class="key-finding-text">
        <strong>Key finding:</strong> Architecture is the most consequential difference between these two options. Rippling delivers global payroll as part of one unified system. Paylocity delivers global payroll through Blue Marble, a separate aggregator platform linked to Paylocity HCM by SSO. This choice governs every report, workflow, automation, and audit downstream of payroll.
      </div>
    </div>

    <div class="section-title">Platform Architecture &amp; Data Model</div>
    <div class="compare-card">
      <table class="compare-table">
        <thead>
          <tr><th>Capability</th><th>Rippling Global Payroll</th><th>Paylocity (Blue Marble)</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Platform model</td>
            <td><span class="tag green">Unified</span>One platform for HR, payroll, time, benefits, expenses, and IT across U.S. and global.</td>
            <td><span class="tag amber">Two Systems</span>Paylocity HCM for U.S. and Blue Marble's WebGlobe for international, linked by SSO.</td>
          </tr>
          <tr>
            <td>Employee record</td>
            <td>One record per employee across every country with one consistent data model.</td>
            <td>Separate records across two systems with no shared underlying data model.</td>
          </tr>
          <tr>
            <td>Global engine type</td>
            <td><span class="tag purple">Native + Partner</span>Native in-house engines in seven core countries with single-partner-managed coverage in 160+ others, all delivered through one platform.</td>
            <td><span class="tag amber">Aggregator</span>Network of in-country partners (ICPs) doing local calculation with Blue Marble's WebGlobe sitting on top as a data layer.</td>
          </tr>
          <tr>
            <td>Country coverage</td>
            <td>160+ countries supported through one workflow.</td>
            <td>100+ countries supported through Blue Marble's ICP network.</td>
          </tr>
          <tr>
            <td>Data propagation</td>
            <td><span class="tag green">Automatic</span>HR changes flow directly into the next pay run with no manual handoff.</td>
            <td><span class="tag amber">Manual</span>Each pay cycle, inputs are submitted to a Blue Marble project manager who routes to the ICP.</td>
          </tr>
          <tr>
            <td>U.S. and global integration</td>
            <td>U.S. payroll and global payroll share the same database, the same reporting, and the same GL.</td>
            <td>U.S. payroll and global payroll live in separate databases, with reconciliation required between them.</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ─── Render: Payroll Operations ─── */
function renderOperations() {
  return `
    <div class="section-title">Pay Cycle Operations</div>
    <div class="compare-card">
      <table class="compare-table">
        <thead>
          <tr><th>Capability</th><th>Rippling Global Payroll</th><th>Paylocity (Blue Marble)</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>HRIS to payroll sync</td>
            <td><span class="tag green">Automatic</span>Hires, terminations, raises, and time off flow directly into the next pay run.</td>
            <td><span class="tag amber">Manual</span>Inputs submitted to Blue Marble PM each cycle. Data does not natively flow from Paylocity HCM.</td>
          </tr>
          <tr>
            <td>Pre-process visibility</td>
            <td><span class="tag green">Gross-to-Net</span>Calculated preview before approval, including taxes and net pay.</td>
            <td><span class="tag amber">Gross Only</span>Gross register provided pre-process. Gross-to-net is not available.</td>
          </tr>
          <tr>
            <td>Time and attendance</td>
            <td><span class="tag green">Native</span>Approved hours flow directly into the next pay run.</td>
            <td><span class="tag amber">Limited</span>Paylocity Time and Labor does not natively integrate with Blue Marble payroll.</td>
          </tr>
          <tr>
            <td>Off-cycle pay runs</td>
            <td><span class="tag green">Unlimited</span>Included; processed in the platform.</td>
            <td><span class="tag amber">PM Coordinated</span>Routed through project manager and ICP; takes days.</td>
          </tr>
          <tr>
            <td>Corrections</td>
            <td><span class="tag green">Same Day</span>Most corrections processed the same day in the platform.</td>
            <td><span class="tag amber">Multi Day</span>Corrections require coordination across U.S. and local time zones, taking several days.</td>
          </tr>
          <tr>
            <td>Pay run flexibility</td>
            <td>Adjust or approve up to days before pay day.</td>
            <td>Cycle governed by Blue Marble PM and ICP submission deadlines.</td>
          </tr>
          <tr>
            <td>Funding and FX</td>
            <td>In-platform funding and FX across U.S. and global.</td>
            <td>In-platform funding through Blue Marble; separate from Paylocity U.S. funding.</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ─── Render: Data & Reporting ─── */
function renderData() {
  return `
    <div class="key-finding">
      <div class="key-finding-icon">i</div>
      <div class="key-finding-text">
        <strong>Why this matters:</strong> When payroll data lives in the same system as everything else, reporting becomes a query rather than a stitching exercise. Workflows span the entire workforce. Finance closes from a single feed. With separate systems linked by SSO, every cross-system question becomes a manual reconciliation.
      </div>
    </div>

    <div class="section-title">Reporting, Automation &amp; Finance</div>
    <div class="compare-card">
      <table class="compare-table">
        <thead>
          <tr><th>Capability</th><th>Rippling Global Payroll</th><th>Paylocity (Blue Marble)</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Consolidated reporting</td>
            <td><span class="tag green">One Report</span>U.S. and global payroll, time, benefits, and headcount in a single report.</td>
            <td><span class="tag amber">Per System</span>Country-by-country in Blue Marble. Cross-system reporting requires Excel stitching.</td>
          </tr>
          <tr>
            <td>GL integration</td>
            <td><span class="tag green">Single Feed</span>One GL feed to NetSuite, QuickBooks, Sage Intacct, and others, covering all countries.</td>
            <td><span class="tag amber">Two Feeds</span>Paylocity GL for U.S. and Blue Marble GL for international. Reconciliation required each close.</td>
          </tr>
          <tr>
            <td>Workflow automation</td>
            <td><span class="tag green">Cross Country</span>One workflow spans all employees regardless of country.</td>
            <td><span class="tag amber">Per System</span>Workflows must be designed and maintained separately for each platform.</td>
          </tr>
          <tr>
            <td>Audit trail</td>
            <td>Unified across the workforce. One log of who changed what, when.</td>
            <td>Split between Paylocity HCM and Blue Marble. Audit requires pulling from both.</td>
          </tr>
          <tr>
            <td>Headcount and cost analytics</td>
            <td>Global view in one query. Slice by department, manager, cost center, or job title across the entire workforce.</td>
            <td>Manual stitching in Excel for any view that spans U.S. and global headcount.</td>
          </tr>
          <tr>
            <td>Downstream automation</td>
            <td><span class="tag green">Native</span>Payroll events trigger benefits, IT provisioning, app access, and expense rules in any country.</td>
            <td><span class="tag amber">Limited</span>Cross-platform automation requires custom integrations or manual handoffs.</td>
          </tr>
          <tr>
            <td>Finance close</td>
            <td>One reconciliation per period.</td>
            <td>Two-system reconciliation each close.</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ─── Render: Service & Compliance ─── */
function renderService() {
  return `
    <div class="section-title">Service Model &amp; Statutory Compliance</div>
    <div class="compare-card">
      <table class="compare-table">
        <thead>
          <tr><th>Capability</th><th>Rippling Global Payroll</th><th>Paylocity (Blue Marble)</th></tr>
        </thead>
        <tbody>

/* ─── Custom Modal ─── */
function showModal(title, subtitle, placeholder) {
  return new Promise((resolve) => {
    const docHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, document.body.offsetHeight);
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.height = docHeight + 'px';

    const box = document.createElement('div');
    box.className = 'modal-box';
    box.style.top = '160px';
    box.innerHTML = `
      <div class="modal-title">${title}</div>
      <div class="modal-subtitle">${subtitle}</div>
      <input class="modal-input" type="text" placeholder="${placeholder}" autofocus>
      <div class="modal-actions">
        <button class="modal-cancel">Cancel</button>
        <button class="modal-confirm">Continue</button>
      </div>
    `;

    document.body.appendChild(overlay);
    document.body.appendChild(box);
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => { overlay.classList.add('visible'); box.classList.add('visible'); });

    const input = box.querySelector('.modal-input');
    const confirm = () => { cleanup(); resolve(input.value); };
    const cancel = () => { cleanup(); resolve(null); };
    const cleanup = () => {
      overlay.classList.remove('visible');
      box.classList.remove('visible');
      document.body.style.overflow = '';
      setTimeout(() => { overlay.remove(); box.remove(); }, 150);
    };

    box.querySelector('.modal-confirm').onclick = confirm;
    box.querySelector('.modal-cancel').onclick = cancel;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirm();
      if (e.key === 'Escape') cancel();
    });
    overlay.addEventListener('click', cancel);
    setTimeout(() => input.focus(), 50);
  });
}

/* ─── PDF Export ─── */
async function exportPDF() {
  const customerName = await showModal(
    'Export to PDF',
    'This name will appear on each page of the exported document. <span style="color:#8a5a6f;font-weight:600;">This is optional.</span>',
    'Enter Prospect or Customer Name'
  );
  if (customerName === null) return;

  const btn = document.getElementById('header-export-btn');
  const originalText = btn.innerHTML;
  btn.classList.add('exporting');
  btn.innerHTML = '⏳ Exporting...';

  const pages = ['architecture', 'operations', 'data', 'service', 'summary'];
  const pageNames = ['Architecture', 'Payroll Operations', 'Data & Reporting', 'Service & Compliance', 'Summary'];

  const now = new Date();
  const tzAbbr = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
  const stampOptions = { month: '2-digit', day: '2-digit', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
  const localStamp = new Intl.DateTimeFormat('en-US', stampOptions).format(now).replace(',', ' at') + ' ' + tzAbbr;

  const originalPage = state.page;
  const headerEl = document.querySelector('.header');
  const containerEl = document.querySelector('.container');
  const { jsPDF } = window.jspdf;

  document.body.classList.add('print-mode');

  let preparedEl = null;
  if (customerName.trim()) {
    preparedEl = document.createElement('p');
    preparedEl.className = 'prepared-for';
    preparedEl.style.cssText = 'font-size:13px;color:rgba(255,255,255,0.9);margin-top:4px;font-weight:600;letter-spacing:0.01em;';
    preparedEl.textContent = 'Prepared for: ' + customerName.trim();
    headerEl.appendChild(preparedEl);
  }

  try {
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const usableWidth = pageWidth - margin * 2;

    for (let i = 0; i < pages.length; i++) {
      state.page = pages[i];
      render();
      await new Promise(r => setTimeout(r, 400));

      const headerCanvas = await html2canvas(headerEl, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null,
        logging: false,
        windowWidth: 960
      });

      const contentCanvas = await html2canvas(containerEl, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#fafafa',
        logging: false,
        windowWidth: 960
      });

      if (i > 0) pdf.addPage();

      // Header
      const headerImg = headerCanvas.toDataURL('image/png');
      const headerWidth = pageWidth;
      const headerHeight = (headerCanvas.height / headerCanvas.width) * headerWidth;
      pdf.addImage(headerImg, 'PNG', 0, 0, headerWidth, headerHeight);

      // Page label on header
      pdf.setFontSize(9);
      pdf.setTextColor(255, 255, 255);
      pdf.text(pageNames[i], pageWidth - margin, headerHeight - 10, { align: 'right' });

      // Content
      const contentImg = contentCanvas.toDataURL('image/jpeg', 0.92);
      const contentWidth = usableWidth;
      const contentHeight = (contentCanvas.height / contentCanvas.width) * contentWidth;
      const contentTop = headerHeight + 4;

      const availHeight = pageHeight - contentTop - 28;
      let finalHeight = contentHeight;
      let finalWidth = contentWidth;
      if (contentHeight > availHeight) {
        const scale = availHeight / contentHeight;
        finalHeight = availHeight;
        finalWidth = contentWidth * scale;
      }

      const contentX = (pageWidth - finalWidth) / 2;
      pdf.addImage(contentImg, 'JPEG', contentX, contentTop, finalWidth, finalHeight);

      // Footer
      pdf.setFontSize(8);
      pdf.setTextColor(160, 160, 160);
      pdf.text('Internal use only. Confidential.', margin, pageHeight - 20);
      pdf.text('Created on ' + localStamp, margin, pageHeight - 10);
      pdf.text('Page ' + (i + 1) + ' of ' + pages.length, pageWidth - margin, pageHeight - 10, { align: 'right' });
    }

    const dateStr = new Date().toISOString().slice(0, 10);
    const safeName = customerName.trim() ? customerName.trim().replace(/[^a-zA-Z0-9 ]/g, '').replace(/\s+/g, '-') + '-' : '';
    pdf.save('Rippling-vs-Paylocity-Blue-Marble-Global-Payroll-' + safeName + dateStr + '.pdf');

  } catch (e) {
    console.error('PDF export failed:', e);
    alert('PDF export failed. Please try again.');
  }

  if (preparedEl) preparedEl.remove();
  document.body.classList.remove('print-mode');
  state.page = originalPage;
  render();
  btn.classList.remove('exporting');
  btn.innerHTML = originalText;
}

render();
</script>
